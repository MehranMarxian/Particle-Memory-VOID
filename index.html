<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VOID / PARTICLE MEMORY</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #stage {
        width: 100%;
        height: 100%;
      }
      #devhud {
        position: fixed;
        left: 12px;
        top: 12px;
        font: 11px/1.6 ui-monospace, monospace;
        color: #9a9a9a;
        white-space: pre;
        pointer-events: none;
        user-select: none;
      }
      #statelabel {
        position: fixed;
        right: 16px;
        top: 14px;
        font: 11px ui-monospace, monospace;
        color: #d8d8d8;
        letter-spacing: 0.4em;
        pointer-events: none;
        user-select: none;
      }
      #credit {
        position: fixed;
        right: 16px;
        bottom: 14px;
        font: 10px ui-monospace, monospace;
        color: #3f3f3f;
        letter-spacing: 0.12em;
        pointer-events: none;
        user-select: none;
      }
      #addsource {
        position: fixed;
        left: 16px;
        bottom: 14px;
        font: 10px ui-monospace, monospace;
        color: #6d6d6d;
        background: none;
        border: 1px solid #2c2c2c;
        padding: 6px 14px;
        letter-spacing: 0.2em;
        cursor: pointer;
        z-index: 20;
      }
      #addsource:hover {
        color: #cfcfcf;
        border-color: #4a4a4a;
      }
      #preview {
        position: fixed;
        left: 16px;
        bottom: 52px;
        display: flex;
        align-items: flex-end;
        gap: 10px;
        z-index: 15;
      }
      #preview-canvas {
        display: none;
        width: 96px;
        height: auto;
        border: 1px solid #262626;
        image-rendering: auto;
      }
      #preview-meta {
        font: 10px/1.7 ui-monospace, monospace;
        color: #5c5c5c;
        letter-spacing: 0.08em;
        white-space: pre;
      }
      #dropzone {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.82);
        z-index: 50;
        pointer-events: none;
      }
      #dropzone div {
        border: 1px dashed #4a4a4a;
        padding: 34px 56px;
        font: 12px ui-monospace, monospace;
        color: #bdbdbd;
        letter-spacing: 0.35em;
        text-align: center;
        line-height: 2.2;
      }
      #filepicker {
        display: none;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        font: 11px ui-monospace, monospace;
        color: #555;
        letter-spacing: 0.15em;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="devhud"></div>
    <div id="statelabel">RECONSTRUCT</div>
    <div id="hint">DRAG ORBIT / SCROLL ZOOM</div>
    <div id="preview">
      <canvas id="preview-canvas"></canvas>
      <div id="preview-meta"></div>
    </div>
    <button id="addsource">ADD SOURCE</button>
    <input id="filepicker" type="file"
      accept=".png,.jpg,.jpeg,.webp,.bmp,.gif,.glb,.gltf,.obj,.stl,.ply" />
    <div id="dropzone">
      <div>DROP SOURCE<br><span style="letter-spacing:0.18em; color:#666;">PNG · JPG · WEBP · GLB · GLTF · OBJ · STL · PLY</span></div>
    </div>
    <div id="credit">DEVELOPED BY MEHRAN AHMADI © 2026</div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
