<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/void-64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/void-32.png" />
    <link rel="apple-touch-icon" href="/icons/void-192.png" />
    <title>VOID / PARTICLE MEMORY</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #stage {
        width: 100%;
        height: 100%;
      }
      #addsource {
        position: fixed;
        left: 16px;
        bottom: 14px;
        font: 10px ui-monospace, monospace;
        color: #6d6d6d;
        background: none;
        border: 1px solid #2c2c2c;
        padding: 6px 14px;
        letter-spacing: 0.2em;
        cursor: pointer;
        z-index: 20;
      }
      #addsource:hover {
        color: #cfcfcf;
        border-color: #4a4a4a;
      }
      #preview {
        position: fixed;
        left: 16px;
        bottom: 52px;
        display: flex;
        align-items: flex-end;
        gap: 10px;
        z-index: 15;
      }
      #preview-canvas {
        display: none;
        width: 96px;
        height: auto;
        border: 1px solid #262626;
        image-rendering: auto;
      }
      #preview-meta {
        font: 10px/1.7 ui-monospace, monospace;
        color: #5c5c5c;
        letter-spacing: 0.08em;
        white-space: pre;
      }
      #dropzone {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.82);
        z-index: 50;
        pointer-events: none;
      }
      #dropzone div {
        border: 1px dashed #4a4a4a;
        padding: 34px 56px;
        font: 12px ui-monospace, monospace;
        color: #bdbdbd;
        letter-spacing: 0.35em;
        text-align: center;
        line-height: 2.2;
      }
      #filepicker {
        display: none;
      }
      #splash {
        position: fixed;
        inset: 0;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 200;
        transition: opacity 1.4s ease;
      }
      #splash img {
        width: min(30vh, 260px);
        height: auto;
      }
      #splash.gone {
        opacity: 0;
        pointer-events: none;
      }
      body.screensaver #panel,
      body.screensaver #panel-toggle-btn,
      body.screensaver #addsource,
      body.screensaver #preview {
        display: none !important;
      }
      body.screensaver,
      body.screensaver * {
        cursor: none !important;
      }
      body.cursor-hidden,
      body.cursor-hidden * {
        cursor: none !important;
      }
    </style>
  </head>
  <body>
    <script>
      window.addEventListener("error", function (e) {
        document.title = "ERR " + (e.message || "unknown");
      });
      window.addEventListener("unhandledrejection", function (e) {
        document.title = "REJ " + ((e.reason && e.reason.message) || "unknown");
      });
    </script>
    <div id="stage"></div>
    <div id="preview">
      <canvas id="preview-canvas"></canvas>
      <div id="preview-meta"></div>
    </div>
    <button id="addsource">ADD SOURCE</button>
    <input id="filepicker" type="file"
      accept=".png,.jpg,.jpeg,.webp,.bmp,.gif,.glb,.gltf,.obj,.stl,.ply" />
    <div id="dropzone">
      <div>DROP SOURCE<br><span style="letter-spacing:0.18em; color:#666;">PNG · JPG · WEBP · GLB · GLTF · OBJ · STL · PLY</span></div>
    </div>
    <div id="splash"><img src="/void-logo.png" alt="VOID / PARTICLE MEMORY" /></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
