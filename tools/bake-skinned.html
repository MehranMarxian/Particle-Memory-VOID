<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VOID - Bake a Body</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #050505; color: #cfcfcf; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 13px; letter-spacing: 0.2em; font-weight: 400; color: #eee; }
  p { color: #8f8f8f; }
  label { display: grid; grid-template-columns: 160px 1fr; align-items: center; gap: 12px; margin: 8px 0; }
  input, select, button, a.btn { background: #111; color: #ddd; border: 1px solid #333; padding: 6px 10px; font: inherit; }
  button, a.btn { cursor: pointer; letter-spacing: 0.12em; text-decoration: none; display: inline-block; margin: 12px 12px 0 0; }
  button:disabled { opacity: 0.4; cursor: default; }
  #log { margin-top: 16px; min-height: 1.5em; color: #e8e8e8; }
  canvas { display: block; margin-top: 16px; border: 1px solid #222; max-width: 100%; }
</style>
</head>
<body>
<main>
  <h1>VOID · BAKE A BODY</h1>
  <p>Drop a rigged, animated character (a Mixamo FBX with skin, or a GLB). Points are chosen once on its skin and carried
    through its animation, coloured from its textures: a 4D clip VOID plays. Nothing leaves this machine.</p>
  <label>Model <input id="file" type="file" accept=".fbx,.glb,.gltf" /></label>
  <label>Animation <select id="clip"></select></label>
  <label>Points per frame <input id="points" type="number" value="12000" min="500" max="50000" step="500" /></label>
  <label>Frames a second <input id="fps" type="number" value="30" min="5" max="60" /></label>
  <label>Seconds <input id="seconds" type="number" step="0.05" min="0.1" placeholder="the whole animation" /></label>
  <button id="bake" disabled>BAKE</button>
  <a id="save" class="btn" hidden>SAVE</a>
  <div id="log">Drop a model anywhere on the page.</div>
  <canvas id="preview" width="720" height="420"></canvas>
</main>
<script type="module" src="./bakeSkinned.ts"></script>
</body>
</html>
