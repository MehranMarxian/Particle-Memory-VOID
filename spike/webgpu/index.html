<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VOID · WebGPU spike</title>
    <style>
      html, body { margin: 0; height: 100%; background: #010102; color: #cfcfd4; font: 12px/1.5 ui-monospace, Consolas, monospace; }
      #stage { position: fixed; inset: 0; }
      #stage canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
      #ui { position: fixed; top: 12px; left: 12px; display: flex; gap: 8px; align-items: center; z-index: 1; }
      #hud { position: fixed; bottom: 12px; left: 12px; z-index: 1; }
      #out { position: fixed; top: 48px; left: 12px; margin: 0; z-index: 1; white-space: pre; background: #0008; }
      button, select { background: #111; color: inherit; border: 1px solid #333; padding: 4px 8px; font: inherit; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="ui">
      <select id="route">
        <option value="raw">(a) raw WebGPU</option>
        <option value="tsl">(b) three TSL · WebGPU</option>
        <option value="tsl-gl">(b) three TSL · WebGL2</option>
      </select>
      <select id="count"></select>
      <button id="live">LIVE</button>
      <button id="bench">BENCH ALL</button>
      <span>space: RECONSTRUCT / VOID</span>
    </div>
    <pre id="out"></pre>
    <div id="hud">pick a route and press LIVE, or BENCH ALL</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
